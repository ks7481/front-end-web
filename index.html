    <style>
      :root {
        --bg: #f7f7f5;
        --text: #1d1d1f;
        --muted: #6b6b70;
        --link: #1a56c4;
        --line: #dcdcd8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --text: #ececec;
          --muted: #9a9aa0;
          --link: #7fb0ff;
          --line: #33353a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }
      h1 { font-size: 2rem; margin: 0 0 0.25rem; }
      .sub { color: var(--muted); margin: 0 0 2.5rem; }
      section { border-top: 1px solid var(--line); padding: 1rem 0 1.25rem; }
      h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      ul { margin: 0; padding-left: 1.25rem; }
      li { margin: 0.2rem 0; }
      a { color: var(--link); }
      a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    </style>
  </head>
