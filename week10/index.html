<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="plate">
        <h1>Mini Library</h1>
        <p>Only four shelves to search through.</p>
      </div>
      <label class="global">Most books per shelf
        <select id="limit">
          <option>6</option>
          <option selected>10</option>
          <option>14</option>
          <option>20</option>
        </select>
      </label>
    </header>

    <main id="shelves"></main>

    <div id="popup" role="dialog" aria-label="Book details" hidden></div>

    <footer>
      Book data from <a href="https://openlibrary.org">Open Library</a>. Covers and records belong to their contributors.
    </footer>
  </body>
</html>
